<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120422" />
      <stop offset="100%" stop-color="#2d064e" />
    </linearGradient>

    <!-- Nave Brand Gradients -->
    <linearGradient id="topLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FF3E6C" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <linearGradient id="topRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#5A189A" />
    </linearGradient>
    <linearGradient id="bottomRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E6C" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Main Device & Receipt Group (isometric perspective transformation) -->
  <g transform="translate(245, 290) rotate(-16) skewX(12)">
    
    <!-- 1. Printer Compartment (Behind the screen) -->
    <rect x="-85" y="-185" width="170" height="70" rx="18" fill="#1e0434" />
    <rect x="-81" y="-181" width="162" height="62" rx="14" fill="#310954" />
    
    <!-- 2. Paper Receipt coming out of the slot -->
    <!-- Paper Border/Shadow -->
    <path d="M 0,-155 L 0,-215 C 0,-242 60,-242 60,-215 L 60,-130 C 60,-102 90,-102 90,-120" 
          fill="none" stroke="#d8b4fe" stroke-width="106" stroke-linecap="square" />
    <!-- Paper Body -->
    <path d="M 0,-155 L 0,-215 C 0,-240 60,-240 60,-215 L 60,-130 C 60,-100 90,-100 90,-120" 
          fill="none" stroke="#ffffff" stroke-width="100" stroke-linecap="square" />

    <!-- Receipt Simulation Lines (on the front-facing part of the paper roll) -->
    <line x1="20" y1="-195" x2="80" y2="-195" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <line x1="20" y1="-180" x2="95" y2="-180" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <line x1="20" y1="-165" x2="70" y2="-165" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <line x1="20" y1="-150" x2="85" y2="-150" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

    <!-- 3. Terminal Main Body Case -->
    <!-- Shadow outer edge -->
    <rect x="-90" y="-140" width="180" height="290" rx="30" fill="#a78bfa" opacity="0.12" />
    <!-- Outer shell -->
    <rect x="-88" y="-138" width="176" height="286" rx="28" fill="#2e0854" />
    <!-- Main purple/violet bezel -->
    <rect x="-84" y="-134" width="168" height="278" rx="24" fill="#4c1d95" />
    <!-- Inner dark frame -->
    <rect x="-80" y="-130" width="160" height="270" rx="20" fill="#1e1b4b" />
    
    <!-- Side Card Reader Slot Accent -->
    <line x1="84" y1="-70" x2="84" y2="90" stroke="#120422" stroke-width="5" stroke-linecap="round" />
    <line x1="84" y1="-30" x2="84" y2="50" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- 4. Active Smart Screen (White background) -->
    <rect x="-76" y="-126" width="152" height="252" rx="16" fill="#ffffff" />
    
    <!-- Camera Notch (Top of screen) -->
    <path d="M -15,-126 C -15,-116 -8,-110 0,-110 C 8,-110 15,-116 15,-126 Z" fill="#1e1b4b" />
    <!-- Speaker ear piece slot -->
    <line x1="-12" y1="-132" x2="12" y2="-132" stroke="#1e0434" stroke-width="2" stroke-linecap="round" />

    <!-- 5. Nave Point Brand Logo on Screen -->
    <!-- Nave Arrow Symbol (Centered) -->
    <g transform="translate(-32.5, -90) scale(0.128)">
      <path d="M 256,256 L 256,64 L 112,64 Q 64,64 100,100 L 256,256 Z" fill="url(#topLeftGrad)" />
      <path d="M 256,256 L 256,64 L 400,64 Q 448,64 448,112 L 448,256 Z" fill="url(#topRightGrad)" />
      <path d="M 256,256 L 448,256 L 448,400 Q 448,448 412,412 L 256,256 Z" fill="url(#bottomRightGrad)" />
    </g>

    <!-- "nave" typography (custom vector paths based on official font) -->
    <g transform="translate(-48.5, 0) scale(0.65)" stroke="#120422" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Letter 'n' -->
      <path d="M 6,34 L 6,18 C 6,11 11,6 18,6 C 25,6 30,11 30,18 L 30,34" />
      <!-- Letter 'a' -->
      <path d="M 68,20 C 68,11 60,6 53,6 C 46,6 38,11 38,20 C 38,29 46,34 53,34 C 60,34 68,29 68,20 M 68,15 L 68,34" />
      <!-- Letter 'v' -->
      <path d="M 78,6 L 91,30 C 92.5,33 95.5,33 97,30 L 110,6" />
      <!-- Letter 'e' -->
      <path d="M 144,20 C 144,11 136,6 129,6 C 122,6 114,11 114,20 C 114,29 122,34 129,34 C 136,34 144,29 144,22 M 116,20 L 142,20" />
    </g>

    <!-- "POINT" Subtitle -->
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#7c3aed" text-anchor="middle" letter-spacing="3.5">POINT</text>

  </g>
</svg>
